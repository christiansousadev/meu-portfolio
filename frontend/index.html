    <!-- Aplica o tema antes do primeiro paint: escolha salva ou preferência do sistema -->
    <script>
      (function () {
        var theme = "light";
        try {
          var saved = window.localStorage.getItem("portfolio_theme");
          if (saved === "light" || saved === "dark") {
            theme = saved;
          } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
            theme = "dark";
          }
        } catch (e) {
          // storage bloqueado: segue com o tema claro
        }
        document.documentElement.setAttribute("data-theme", theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "dark" ? "#0E1713" : "#EEF2EC");
      })();
    </script>

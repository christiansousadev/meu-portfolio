<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="itilBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1736"/>
      <stop offset="100%" stop-color="#0F0C1B"/>
    </linearGradient>
    <linearGradient id="itilBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5C9"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>
    <filter id="itilGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#00E5C9" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Hexagon Badge Shape -->
  <polygon points="60,6 106,32 106,88 60,114 14,88 14,32" fill="url(#itilBg)" stroke="url(#itilBorder)" stroke-width="3" filter="url(#itilGlow)"/>
  
  <!-- Inner Ring / Accent -->
  <polygon points="60,14 98,36 98,84 60,106 22,84 22,36" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Logo Mark -->
  <g transform="translate(60, 48)">
    <!-- Swirl / Ribbon Icon -->
    <path d="M-16,-10 C-10,-18 10,-18 16,-10 C22,-2 14,8 0,8 C-14,8 -22,-2 -16,-10 Z" fill="none" stroke="#00E5C9" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="-6" r="4" fill="#7C3AED"/>
    <!-- ITIL Text -->
    <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">ITIL® 4</text>
  </g>

  <!-- Level Banner -->
  <rect x="26" y="82" width="68" height="16" rx="4" fill="rgba(0, 229, 201, 0.15)" stroke="#00E5C9" stroke-width="1"/>
  <text x="60" y="93.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="800" fill="#00E5C9" text-anchor="middle" letter-spacing="1">FOUNDATION</text>
</svg>
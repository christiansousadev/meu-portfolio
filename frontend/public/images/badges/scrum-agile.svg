<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="scrumBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B1430"/>
      <stop offset="100%" stop-color="#0E0B1A"/>
    </linearGradient>
    <linearGradient id="scrumBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="scrumGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#F59E0B" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Circular / Cogwheel Badge Shape -->
  <circle cx="60" cy="60" r="52" fill="url(#scrumBg)" stroke="url(#scrumBorder)" stroke-width="3" filter="url(#scrumGlow)"/>
  
  <!-- Inner Dashed Ring (Sprint Cycle) -->
  <circle cx="60" cy="60" r="44" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Sprint Loop Icon -->
  <g transform="translate(60, 46)">
    <!-- Circular Arrow Loop -->
    <path d="M-12,4 A14,14 0 1,1 8,10" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <polygon points="12,4 16,13 7,12" fill="#F59E0B"/>
    <!-- Velocity / Lightning Inside -->
    <path d="M-3,-6 L2,-1 L-1,1 L3,6" fill="none" stroke="#EC4899" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title -->
  <text x="60" y="77" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">SCRUM &amp; AGILE</text>
  
  <!-- Sub-label Banner -->
  <rect x="26" y="85" width="68" height="15" rx="3.5" fill="rgba(245, 158, 11, 0.18)" stroke="#F59E0B" stroke-width="1"/>
  <text x="60" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="800" fill="#F59E0B" text-anchor="middle" letter-spacing="0.8">PROJECT SPECIALIST</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="pyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081E24"/>
      <stop offset="100%" stop-color="#040F12"/>
    </linearGradient>
    <linearGradient id="pyBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#009688"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="pyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#009688" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Octagon / Diamond Tech Badge Shape -->
  <polygon points="60,6 106,24 114,60 106,96 60,114 14,96 6,60 14,24" fill="url(#pyBg)" stroke="url(#pyBorder)" stroke-width="3" filter="url(#pyGlow)"/>
  
  <!-- Inner Line -->
  <polygon points="60,14 98,30 105,60 98,90 60,105 22,90 15,60 22,30" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Python & FastAPI Icons Combined -->
  <g transform="translate(60, 46)">
    <!-- Fast Lightning / Teal Accent -->
    <path d="M-4,-18 L8,-6 L1,-6 L5,6 L-7,-6 L-1,-6 Z" fill="#00E5C9" opacity="0.9"/>
    <!-- Code Brackets -->
    <path d="M-14,-6 L-20,0 L-14,6" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M14,-6 L20,0 L14,6" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title -->
  <text x="60" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">PYTHON &amp; FASTAPI</text>
  
  <!-- Sub-label Banner -->
  <rect x="25" y="84" width="70" height="15" rx="3.5" fill="rgba(0, 150, 136, 0.2)" stroke="#00E5C9" stroke-width="1"/>
  <text x="60" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="800" fill="#00E5C9" text-anchor="middle" letter-spacing="0.8">ARCHITECT SPECIALIST</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="isoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1E2E"/>
      <stop offset="100%" stop-color="#07101A"/>
    </linearGradient>
    <linearGradient id="isoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="isoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#38BDF8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Shield Badge Shape -->
  <path d="M60,6 L104,22 C104,70 60,112 60,114 C60,112 16,70 16,22 Z" fill="url(#isoBg)" stroke="url(#isoBorder)" stroke-width="3" filter="url(#isoGlow)"/>
  
  <!-- Inner Shield Line -->
  <path d="M60,14 L96,28 C96,68 60,104 60,105 C60,104 24,68 24,28 Z" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Shield Lock & Checkmark Icon -->
  <g transform="translate(60, 48)">
    <!-- Padlock -->
    <rect x="-11" y="-6" width="22" height="18" rx="3" fill="rgba(56, 189, 248, 0.15)" stroke="#38BDF8" stroke-width="2"/>
    <path d="M-6,-6 V-12 C-6,-16 6,-16 6,-12 V-6" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <!-- Center Checkmark -->
    <path d="M-4,3 L-1,6 L5,-1" fill="none" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title & Standard -->
  <text x="60" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">ISO 27001</text>
  
  <!-- Sub-label Banner -->
  <rect x="28" y="86" width="64" height="15" rx="3.5" fill="rgba(52, 211, 153, 0.15)" stroke="#34D399" stroke-width="1"/>
  <text x="60" y="97" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="800" fill="#34D399" text-anchor="middle" letter-spacing="0.8">LGPD GOVERNANCE</text>
</svg>